name: Déploiement

# Après chaque fusion sur main : image construite ici, envoyée en test (staging)
# automatiquement, puis en production après approbation manuelle (ADR-0009).
#
# Secrets requis (Settings → Environments → staging et production) :
#   VPS_HOST          adresse du serveur
#   VPS_KNOWN_HOSTS   empreinte SSH du serveur (évite de faire confiance à n'importe quelle machine)
#   DEPLOY_SSH_KEY    clé privée du compte `deploy`

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pas de verrou global : il faisait attendre un nouveau déploiement derrière une
# approbation de production restée en attente. Les verrous sont posés par job.

permissions:
  contents: read

env:
  IMAGE: ghcr.io/baracushanson/prometheus-people:sha-${{ github.sha }}
  IMAGE_SAUVEGARDE: ghcr.io/baracushanson/prometheus-backup:sha-${{ github.sha }}

jobs:
  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image de sauvegarde
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          push: true
          tags: ${{ env.IMAGE_SAUVEGARDE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=sauvegarde
          cache-to: type=gha,mode=max,scope=sauvegarde

  staging:
    name: Test (staging)
    needs: image
    runs-on: ubuntu-latest
    # Deux déploiements en test ne se chevauchent jamais ; ils passent l'un après l'autre.
    concurrency:
      group: deploiement-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.prometheus-people.com
    steps:
      - uses: actions/checkout@v4
      - name: Déployer
        uses: ./.github/actions/deploy-vps
        with:
          environnement: staging
          image: ${{ env.IMAGE }}
          host: ${{ secrets.VPS_HOST }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Vérifier depuis Internet
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://staging.prometheus-people.com/api/health

  production:
    name: Production
    needs: staging
    runs-on: ubuntu-latest
    # Une version plus récente remplace une approbation de production encore en attente :
    # on n'approuve jamais par erreur une version dépassée.
    concurrency:
      group: deploiement-production
      cancel-in-progress: true
    # L'environnement « production » exige une approbation manuelle dans GitHub.
    environment:
      name: production
      url: https://prometheus-people.com
    steps:
      - uses: actions/checkout@v4
      # Pas de production tant qu'un passage des textes légaux reste à compléter (crochets).
      - name: Textes légaux complets
        run: node scripts/verifier-textes-legaux.mjs
      - name: Déployer
        uses: ./.github/actions/deploy-vps
        with:
          environnement: production
          image: ${{ env.IMAGE }}
          host: ${{ secrets.VPS_HOST }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Vérifier depuis Internet
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://prometheus-people.com/api/health
