name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # Base jetable pour les tests d'intégration (ADR-0003) : même version majeure que Neon.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: prometheus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d prometheus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: pnpm check (format, lint, typage, tests)
        run: pnpm check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/prometheus_ci
          BETTER_AUTH_SECRET: secret-de-ci-uniquement-jamais-utilise-ailleurs
          BETTER_AUTH_URL: http://localhost:3000

      # Un changement de schema.ts commité sans sa migration fait échouer la CI.
      - name: Aucune migration oubliée
        run: |
          pnpm db:check
          pnpm db:generate
          if [ -n "$(git status --porcelain src/server/db/migrations)" ]; then
            echo "::error::schema.ts a changé sans migration versionnée. Lancer « pnpm db:generate » et commiter le résultat."
            git status --porcelain src/server/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/prometheus_ci

      - name: Build
        run: pnpm build

      - name: Audit des dépendances de production
        run: pnpm audit --prod --audit-level=high

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Construit les images sans les publier : détecte une erreur de Dockerfile avant la fusion.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image de sauvegarde
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          push: false
          cache-from: type=gha,scope=sauvegarde
          cache-to: type=gha,mode=max,scope=sauvegarde

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # L'action lit la liste des commits de la PR via l'API GitHub.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
